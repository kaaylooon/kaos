name: Build Kernel

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install cross-development tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-multilib g++-multilib binutils

    - name: Build kernel with Make
      run: |
        make

    - name: Verify binary generation
      run: |
        file mykernel.bin
        ls -la mykernel.bin
